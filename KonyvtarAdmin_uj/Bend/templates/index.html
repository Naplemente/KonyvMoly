<!DOCTYPE html>
<html lang="hu">

<head>

<meta charset="UTF-8">
<title>Admin – Könyvkezelő</title>

<style>

body{
font-family:Arial;
margin:40px;
background:#f4f6f8;
}

.card{
background:white;
padding:20px;
margin-bottom:30px;
border-radius:8px;
box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #ddd;
}

button{
padding:8px 12px;
border:none;
border-radius:6px;
cursor:pointer;
}

.primary{
background:#3498db;
color:white;
}

.navbar{
background:#2c3e50;
color:white;
padding:15px 25px;
display:flex;
justify-content:space-between;
margin:-40px -40px 30px -40px;
}

.navbar a{
color:white;
text-decoration:none;
background:#e74c3c;
padding:6px 10px;
border-radius:6px;
margin-left:10px;
}

</style>

</head>

<body>

<div class="navbar">

<div>
<strong>📚 Könyvkezelő Admin</strong>
</div>

<div>

Bejelentkezve: <strong>{{ request.session.get('user') }}</strong>

<a href="/adminok">Admin kezelő</a>

<a href="/logout">Kijelentkezés</a>

</div>

</div>


<div class="card">

<h2>Új könyv hozzáadása</h2>

<form id="konyv-form">

<input type="text" id="title" placeholder="Cím" required>

<input type="text" id="author" placeholder="Szerző" required>

<input type="number" id="year" placeholder="Év" required>

<button class="primary">Hozzáadás</button>

</form>

</div>



<div class="card">

<h2>Könyvek listája</h2>

<input type="text" id="kereso" placeholder="Keresés..." style="width:100%;margin-bottom:10px;padding:8px">

<table>

<thead>

<tr>
<th>Cím</th>
<th>Szerző</th>
<th>Év</th>
</tr>

</thead>

<tbody id="konyv-lista"></tbody>

</table>

</div>



<div class="card">

<h2>Kölcsönzés rögzítése</h2>

<form id="kolcsonzes-form" style="display:flex; gap:10px; flex-wrap:wrap;">

<select id="user" required>
<option value="">Felhasználó kiválasztása</option>
</select>

<select id="peldany" required>
<option value="">Példány kiválasztása</option>
</select>

<input type="date" id="hatarido" required>

<button class="primary">Kölcsönzés</button>

</form>

</div>

<div class="card">

<h2>Aktív kölcsönzések</h2>

<table>

<thead>
<tr>
<th>Könyv</th>
<th>Felhasználó</th>
<th>Kölcsönzés</th>
<th>Határidő</th>
<th>Művelet</th>
</tr>
</thead>

<tbody id="kolcsonzes-lista"></tbody>

</table>

</div>

<script src="/static/js/main.js"></script>

</body>
</html>
